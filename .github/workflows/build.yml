name: Build Mega Drive ROM

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out game source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget texinfo libgmp-dev libmpfr-dev libmpc-dev libisl-dev zlib1g-dev libzstd-dev flex bison libncurses-dev python3-pil

      - name: Build SGDK toolchain
        shell: bash
        run: |
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/marsdev"
            if git clone --depth 1 --recurse-submodules https://github.com/andwn/marsdev.git "$RUNNER_TEMP/marsdev"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Could not clone marsdev after 3 attempts."
              exit 1
            fi
            sleep 5
          done
          cd "$RUNNER_TEMP/marsdev"
          make sgdk -j2
          sudo make install

      - name: Generate Mega Drive room backgrounds
        run: python3 tools/generate_room_assets.py

      - name: Validate indexed assets
        run: python3 tools/validate_assets.py res/yuno.png res/room_on.png res/room_off.png res/title.png

      - name: Compile game ROM
        shell: bash
        run: |
          source /opt/toolchains/mars/mars.sh
          make
          test -s out/rom.bin
          mkdir -p release
          cp out/rom.bin release/YUNO-GASAI-BLOOD-MOON.bin
          sha256sum release/YUNO-GASAI-BLOOD-MOON.bin | tee release/SHA256SUMS.txt
          stat -c 'ROM size: %s bytes' release/YUNO-GASAI-BLOOD-MOON.bin

      - name: Package MD.emu ZIP
        run: |
          cd release
          zip YUNO-GASAI-BLOOD-MOON-MDemu.zip YUNO-GASAI-BLOOD-MOON.bin SHA256SUMS.txt

      - name: Upload ROM and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: YUNO-GASAI-BLOOD-MOON-MDemu
          path: |
            release/YUNO-GASAI-BLOOD-MOON-MDemu.zip
            release/YUNO-GASAI-BLOOD-MOON.bin
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
